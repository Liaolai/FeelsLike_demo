services:
  - type: web
    name: feelslike-westlake
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      # 健康 AI 需要的密钥：值不写进仓库，部署时在 Render 控制台填入。
      # 留空也能正常启动，此时 /api/health-advice 返回 503 not_configured，其余功能不受影响。
      - key: DEEPSEEK_API_KEY
        sync: false
